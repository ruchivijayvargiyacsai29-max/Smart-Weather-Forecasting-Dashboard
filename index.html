<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Weather Detection App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Weather Detection App</h1>
    <input type="text" id="cityInput" placeholder="Enter city name">
    <button onclick="getWeather()">Get Weather</button>

    <!-- Weather Card -->
    <div class="weather-card" id="weatherCard" style="display: none;">
      <h2 id="cityName"></h2>
      <img id="weatherIcon" src="" alt="Weather Icon">
      <p><strong>Temperature:</strong> <span id="temp"></span> °C</p>
      <p><strong>Feels Like:</strong> <span id="feelsLike"></span> °C</p>
      <p><strong>Condition:</strong> <span id="condition"></span></p>
      <p><strong>Humidity:</strong> <span id="humidity"></span>%</p>
      <p><strong>Wind:</strong> <span id="wind"></span> kph</p>
      <p><strong>Air Quality (PM2.5):</strong> <span id="aqi"></span></p>
    </div>

    <!-- Forecast Section -->
    <div class="forecast-container" id="forecast" style="display: none;">
      <h3>3-Day Forecast</h3>
      <div class="forecast-cards" id="forecastCards"></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
